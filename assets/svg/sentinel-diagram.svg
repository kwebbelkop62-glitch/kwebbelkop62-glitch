<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="360" fill="#07111F"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- stage 1 -->
    <rect x="40" y="140" width="190" height="80" rx="10" fill="#0B1626" stroke="rgba(59,130,246,0.35)"/>
    <text x="135" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Evidence Intake</text>
    <text x="135" y="196" text-anchor="middle" font-size="12" fill="#94A3B8">Photo / footage</text>

    <path d="M230 180 L280 180" stroke="rgba(59,130,246,0.5)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 2 -->
    <rect x="280" y="140" width="230" height="80" rx="10" fill="#0B1626" stroke="rgba(139,92,246,0.35)"/>
    <text x="395" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Cross-Source Analysis</text>
    <text x="395" y="196" text-anchor="middle" font-size="12" fill="#94A3B8">Contradiction detection</text>

    <path d="M510 180 L560 180" stroke="rgba(139,92,246,0.5)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 3 -->
    <rect x="560" y="140" width="200" height="80" rx="10" fill="#0B1626" stroke="rgba(59,130,246,0.35)"/>
    <text x="660" y="167" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Human Approval</text>
    <text x="660" y="187" text-anchor="middle" font-size="12" fill="#94A3B8">Green · Amber · Red</text>
    <text x="660" y="204" text-anchor="middle" font-size="11" fill="#94A3B8">boundaries</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="rgba(148,163,184,0.7)"/>
    </marker>
  </defs>

  <text x="400" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">Multi-agency emergency coordination — system proposal</text>
</svg>
